services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pump-api

  pump-api:
    image: ghcr.io/thesaiteja24/pump-api:${PUMP_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - '${PORT}'

  pump-reminder-worker:
    image: ghcr.io/thesaiteja24/pump-api:${PUMP_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    command:
      - sh
      - -lc
      - while true; do bun run dist/src/workers/habit-reminder.scheduler.js; sleep 60; done
    depends_on:
      - pump-api

  pump-api-migrate:
    image: ghcr.io/thesaiteja24/pump-api:${PUMP_API_IMAGE_TAG:-latest}
    env_file:
      - ./.env
    command: [bun, run, migrate:deploy]

volumes:
  caddy_data:
  caddy_config:
