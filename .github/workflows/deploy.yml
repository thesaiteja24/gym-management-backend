name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/pump-api

            # 1. Log in to GitHub Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull and restart the container
            docker compose pull
            docker compose up -d

            # 3. Verify container health status
            echo "Waiting for the container to become healthy..."
            for i in {1..10}; do
              HEALTH_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' pump-api 2>/dev/null || echo '"unhealthy"')
              if [ "$HEALTH_STATUS" = '"healthy"' ]; then
                echo "Container is healthy!"
                break
              fi
              echo "Still waiting ($i/10)... status is $HEALTH_STATUS"
              sleep 3
            done

            if [ "$HEALTH_STATUS" != '"healthy"' ]; then
              echo "Error: Container failed to become healthy!"
              docker compose logs pump-api
              exit 1
            fi

            # 4. Cleanup unused images
            docker image prune -f
