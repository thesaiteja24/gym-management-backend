name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync environment files
        run: bun run env:sync

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: test-build-and-publish
    environment: production
    permissions:
      contents: read
    steps:
      - name: Dispatch deployment to infra repository
        env:
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          INFRA_REPO_DISPATCH_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
        run: |
          set -eu

          if [ -z "${INFRA_REPO:-}" ]; then
            echo "INFRA_REPO variable is not set"
            exit 1
          fi

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_REPO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d '{"event_type":"deploy-pump-api","client_payload":{"image":"ghcr.io/'"${GITHUB_REPOSITORY}"'","tag":"'"${GITHUB_SHA}"'","source_repo":"'"${GITHUB_REPOSITORY}"'"}}'
