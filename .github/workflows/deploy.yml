name: CI, Build, and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pump_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MASTER_URL: postgresql://postgres:password@127.0.0.1:5432/pump_test?sslmode=disable
      REPLICA_URL: postgresql://postgres:password@127.0.0.1:5432/pump_test?sslmode=disable
      SHADOW_URL: postgresql://postgres:password@127.0.0.1:5432/pump_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      GOOGLE_WEB_CLIENT_ID: test-client-id
      SESSION_SECRET: test-session-secret-that-is-at-least-32-characters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run typecheck
        run: bun run typecheck

      - name: Sync test schema
        run: bunx prisma db push --accept-data-loss

      - name: Run tests
        run: bun test test/

  build-and-publish:
    name: Build and Publish
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Dispatch Deploy
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Dispatch deployment to infra repository
        env:
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          INFRA_REPO_DISPATCH_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
        run: |
          set -eu

          if [ -z "${INFRA_REPO:-}" ]; then
            echo "INFRA_REPO variable is not set"
            exit 1
          fi

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_REPO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d '{"event_type":"deploy-pump-api","client_payload":{"image":"ghcr.io/'"${GITHUB_REPOSITORY}"'","tag":"'"${GITHUB_SHA}"'","source_repo":"'"${GITHUB_REPOSITORY}"'"}}'
